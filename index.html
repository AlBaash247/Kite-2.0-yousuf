<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <link href="./css/main.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
    <style>
        .modal-form {
            display: flex;
            flex-flow: column;
            padding-bottom: 12px;
            gap: 16px;
        }

        textarea {
            min-width: 300px;
            min-height: 100px;
            max-width: 300px;
            max-height: 300px;
        }
    </style>


</head>

<body>

    <!-- NAVBAR -->
    <div class="topnav" id="myTopnav">
        <a href="index.html" class="active">Kite</a>
        <a href="index.html">Tasks</a>
        <a href="./pages/quick-tasks.html">Quick-Tasks</a>
        <a href="./pages/profile.html">Profile</a>
        <a href="./pages/login.html">Login</a>
        <a href="./pages/register.html">Register</a>

        <a href="javascript:void(0);" class="icon">
            <i class="fa fa-bars"></i>
        </a>
    </div>


    <div class="main-container">
        <div class="flex row justify-between w-100">
            <h1 class="primary">Tasks</h1>

            <button id="btnAddTask"
                onclick="document.getElementById('createTaskModal').style.display='block'">+</button>
        </div>

        <!-- Page content -->
        <div class="main-tasks-container">

            <!-- LOG -->
            <div class="card tasks-container">
                <div>
                    <h3>Log</h3>
                    <hr />
                </div>

                <div id="logTasksContainer" class="flex column justify-center gap-16">
                    <!-- task card template lives here -->
                </div>
            </div>


            <!-- TODO -->
            <div class="card tasks-container">
                <div>
                    <h3>Todo</h3>
                    <hr />
                </div>

                <div id="todoTasksContainer" class="flex column justify-center gap-16">
                    <!-- task card template lives here -->
                </div>
            </div>

            <!-- IN PROGRESS -->
            <div class="card tasks-container">
                <div>
                    <h3>In Progress</h3>
                    <hr />
                </div>

                <div id="inProgressTasksContainer" class="flex column justify-center gap-16">
                    <!-- task card template lives here -->
                </div>
            </div>

            <!-- done -->
            <div class="card tasks-container">
                <div>
                    <h3>Review</h3>
                    <hr />
                </div>

                <div id="reviewTasksContainer" class="flex column justify-center gap-16">
                    <!-- task card template lives here -->
                </div>
            </div>

            <!-- DONE -->
            <div class="card tasks-container">
                <div>
                    <h3>Done</h3>
                    <hr />
                </div>

                <div id="DoneTasksContainer" class="flex column justify-center gap-16">
                    <!-- task card template lives here -->
                </div>
            </div>

        </div>

    </div>


    <!-- CREATE TASK MODEL -->
    <div id="createTaskModal" class="w3-modal">
        <div class="w3-modal-content w3-card-4">
            <header class="w3-container">
                <span onclick="document.getElementById('createTaskModal').style.display='none'"
                    class="w3-button w3-display-topright">&times;</span>
                <h2 class="primary">Create Task</h2>
            </header>
            <div class="w3-container">

                <div class="modal-form">

                    <div class="input-group">
                        <label for="inputCategory">Category</label>
                        <select id="inputCategory">
                            <option value="1">Log</option>
                            <option value="2">Todo</option>
                            <option value="3">In Progress</option>
                            <option value="4">Review</option>
                            <option value="5">Done</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="inputName">Name</label>
                        <input id="inputName" type="text">
                    </div>

                    <div class="input-group">
                        <label for="inputDescription">Description</label>
                        <textarea id="inputDescription"> </textarea>
                    </div>


                    <div class="link-group">
                        <button
                            onclick="document.getElementById('createTaskModal').style.display='none'">Cancel</button>
                        <button id="btnSubmit">Save</button>
                    </div>

                </div>


            </div>

        </div>
    </div>


    <!-- UPDATE TASK MODEL -->
    <div id="updateTaskModal" class="w3-modal">
        <div class="w3-modal-content w3-card-4">
            <header class="w3-container">
                <span onclick="document.getElementById('updateTaskModal').style.display='none'"
                    class="w3-button w3-display-topright">&times;</span>
                <h2 class="primary">update Task</h2>
            </header>
            <div class="w3-container">

                <div class="modal-form">

                    <div class="input-group">
                        <label for="inputIdUpdate">Id</label>
                        <input id="inputIdUpdate" type="text" readonly>
                    </div>

                    <div class="input-group">
                        <label for="inputCategoryUpdate">Category</label>
                        <select id="inputCategoryUpdate">
                            <option value="1">Log</option>
                            <option value="2">Todo</option>
                            <option value="3">In Progress</option>
                            <option value="4">Review</option>
                            <option value="5">Done</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="inputNameUpdate">Name</label>
                        <input id="inputNameUpdate" type="text">
                    </div>

                    <div class="input-group">
                        <label for="inputDescriptioUpdate">Description</label>
                        <textarea id="inputDescriptionUpdate"> </textarea>
                    </div>


                    <div class="link-group">
                        <button
                            onclick="document.getElementById('updateTaskModal').style.display='none'">Cancel</button>
                        <button id="btnSubmitUpdate">Save</button>
                    </div>

                </div>


            </div>

        </div>
    </div>



    <!-- task card template-->
    <template id="templateTaskCard">
        <div id="taskCard" class="card">
            <div>
                <div class="flex row justify-end gap-8">

                    <button id="btnTaskUpdate" class="btn btn-transparent"
                        onclick="document.getElementById('updateTaskModal').style.display='block'">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="icon-24 primary">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125" />
                        </svg>

                    </button>

                    <button id="btnTaskDelete" class="btn btn-transparent">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="icon-24 accent3">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                        </svg>
                    </button>
                </div>
                <p id="taskName">Task Name</p>
                <p id="taskDesc" class="text-desc">Task Desc</p>
            </div>
        </div>
    </template>

    <script src="./js/index.js" type="module"></script>

    <script>
        function myFunction() {
            var x = document.getElementById("myTopnav");
            if (x.className === "topnav") {
                x.className += " responsive";
            } else {
                x.className = "topnav";
            }
        }

        let logTasksContainer = document.getElementById("logTasksContainer");
        let todoTasksContainer = document.getElementById("todoTasksContainer");
        let inProgressTasksContainer = document.getElementById("inProgressTasksContainer");
        let reviewTasksContainer = document.getElementById("reviewTasksContainer");
        let doneTasksContainer = document.getElementById("doneTasksContainer");

        let templateTaskCard = document.getElementById("templateTaskCard");

        let inputCategory = document.getElementById("inputCategory");
        let btnSubmit = document.getElementById("btnSubmit");

        btnSubmit.onclick = createTaskCard


        function createTaskCard() {
            let clone = templateTaskCard.content.cloneNode(true);
            console.log(inputCategory.value);
            
            switch (parseInt(inputCategory.value)) {
                case 1:
                    logTasksContainer.appendChild(clone);
                    break;
                case 2:
                    todoTasksContainer.appendChild(clone);
                    break;
                case 3:
                    inProgressTasksContainer.appendChild(clone);
                    break;
                case 4:
                    reviewTasksContainer.appendChild(clone);
                    break;
                case 5:
                    doneTasksContainer.appendChild(clone);
                    break;

                default:
                    break;
            }


        }





    </script>

</body>

</html>
