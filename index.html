<!doctype html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Responsive neumorphic task dashboard">
    <title>Tasks — Softly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.css">
</head>

<body class="tasks-page">
    <div class="tasks-layout" id="tasksLayout">

        <aside class="sidebar" id="sidebar">
            <a class="logo" href="index.html" aria-label="Softly home">
                <span class="brand-mark"><i></i><i></i></span>
                <strong>Softly.</strong>
            </a>

            <button class="sidebar-collapse-button" id="sidebarCollapseButton" type="button"
                aria-label="Collapse sidebar" aria-expanded="true"><span>‹</span></button>

            <nav class="primary-nav" aria-label="Primary navigation">
                <a class="nav-link" href="index.html" data-label="Task Dashboard"><span>▣</span>Task
                    Dashboard</a>
                <a class="nav-link active" href="tasks.html" data-label="Tasks"><span>☷</span>Tasks</a>
                <a class="nav-link" href="calendar.html" data-label="Calendar"><span>□</span>Calendar</a>
                <a class="nav-link" href="team.html" data-label="Team"><span>♧</span>Team</a>
                <a class="nav-link" href="messages.html" data-label="Messages"><span>▢</span>Messages <b
                        class="count">3</b></a>
                <a class="nav-link" href="reports.html" data-label="Reports"><span>♧</span>Reports</a>
                <a class="nav-link" href="profile.html" data-label="Profile"><span>♙</span>Profile</a>
                <a class="nav-link" href="settings.html" data-label="Settings"><span>⚙</span>Settings</a>
            </nav>

            <a class="upgrade-card" href="#">
                <span class="upgrade-icon">✦</span>
                <span><strong>Upgrade to Pro</strong><small>Unlock all features</small></span>
            </a>
        </aside>

        <main class="dashboard-main">
            <header class="dashboard-header">

                <div class="dashboard-title">

                    <button class="icon-button task-mobile-menu" id="menuButton" type="button" aria-label="Open menu"
                        aria-expanded="false">
                        ☰
                    </button>

                    <div>
                        <small>Workspace</small>
                        <h1>Tasks Board</h1>

                        <p>
                            Organize, monitor and update your team’s work.
                        </p>
                    </div>
                </div>

                <div class="dashboard-actions">

                    <label class="search-box task-dashboard-search">
                        <span>⌕</span>

                        <input id="search" type="search" placeholder="Search tasks..." aria-label="Search tasks">
                    </label>

                    <button class="icon-button" id="themeToggle" type="button" aria-label="Switch to dark theme">
                        ☾
                    </button>

                    <button class="avatar-button" type="button" aria-label="Open profile">
                        <img src="https://i.pravatar.cc/100?img=47" alt="Olivia Rhye">
                    </button>
                </div>
            </header>

            <!-- Board summary -->
            <section class="tasks-summary">
                <div>
                    <span class="summary-icon">✓</span>

                    <p>
                        <small>Total tasks</small>
                        <strong id="totalTaskCount">0</strong>
                    </p>
                </div>

                <button class="board-create-button" id="createTaskButton" type="button">
                    <span>＋</span>
                    Create New Task
                </button>
            </section>

            <!-- Task board -->
            <section class="task-board" aria-label="Task board">

                <!-- ========== LOG ========== -->
                <article class="task-column column-log" data-category="log">
                    <header class="task-column-header">
                        <div class="column-title">
                            <span class="column-indicator"></span>

                            <h2>Log</h2>

                            <b class="task-count">0</b>
                        </div>

                        <button class="column-add-button" type="button" data-add-category="log"
                            aria-label="Add a task to Log" title="Add task">
                            ＋
                        </button>
                    </header>

                    <div class="task-list" id="logTasks" data-task-list="log"><button type="button" class="board-task"
                            data-task-id="1" fdprocessedid="u6plsr">
                            <span class="board-task-icon">
                                ◇
                            </span>

                            <span class="board-task-content">
                                <strong>Client requirements received</strong>

                                <small>
                                    Record the initial requirements received from the client.
                                </small>
                            </span>

                            <span class="board-task-arrow">
                                ›
                            </span>
                        </button></div>
                </article>

                <!-- ========== TODO ========== -->
                <article class="task-column column-todo" data-category="todo">
                    <header class="task-column-header">
                        <div class="column-title">
                            <span class="column-indicator"></span>

                            <h2>ToDo</h2>

                            <b class="task-count">0</b>
                        </div>

                        <button class="column-add-button" type="button" data-add-category="todo"
                            aria-label="Add a task to Todo" title="Add task">
                            ＋
                        </button>
                    </header>

                    <div class="task-list" id="todoTasks" data-task-list="todo"><button type="button" class="board-task"
                            data-task-id="1" fdprocessedid="u6plsr">
                            <span class="board-task-icon">
                                ◇
                            </span>

                            <span class="board-task-content">
                                <strong>Client requirements received</strong>

                                <small>
                                    Record the initial requirements received from the client.
                                </small>
                            </span>

                            <span class="board-task-arrow">
                                ›
                            </span>
                        </button></div>
                </article>
                
                <!-- ========== IN PROGRESS ========== -->
                <article class="task-column column-progress" data-category="progress">
                    <header class="task-column-header">
                        <div class="column-title">
                            <span class="column-indicator"></span>

                            <h2>In Progress</h2>

                            <b class="task-count">0</b>
                        </div>

                        <button class="column-add-button" type="button" data-add-category="progress"
                            aria-label="Add a task to progress" title="Add task">
                            ＋
                        </button>
                    </header>

                    <div class="task-list" id="progressTasks" data-task-list="progress"><button type="button" class="board-task"
                            data-task-id="1" fdprocessedid="u6plsr">
                            <span class="board-task-icon">
                                ◇
                            </span>

                            <span class="board-task-content">
                                <strong>Client requirements received</strong>

                                <small>
                                    Record the initial requirements received from the client.
                                </small>
                            </span>

                            <span class="board-task-arrow">
                                ›
                            </span>
                        </button></div>
                </article>
                
                <!-- ========== Review ========== -->
                <article class="task-column column-review" data-category="review">
                    <header class="task-column-header">
                        <div class="column-title">
                            <span class="column-indicator"></span>

                            <h2>Review</h2>

                            <b class="task-count">0</b>
                        </div>

                        <button class="column-add-button" type="button" data-add-category="review"
                            aria-label="Add a task to review" title="Add task">
                            ＋
                        </button>
                    </header>

                    <div class="task-list" id="reviewTasks" data-task-list="review"><button type="button" class="board-task"
                            data-task-id="1" fdprocessedid="u6plsr">
                            <span class="board-task-icon">
                                ◇
                            </span>

                            <span class="board-task-content">
                                <strong>Client requirements received</strong>

                                <small>
                                    Record the initial requirements received from the client.
                                </small>
                            </span>

                            <span class="board-task-arrow">
                                ›
                            </span>
                        </button></div>
                </article>
                
                <!-- ========== Complete ========== -->
                <article class="task-column column-complete" data-category="complete">
                    <header class="task-column-header">
                        <div class="column-title">
                            <span class="column-indicator"></span>

                            <h2>Complete</h2>

                            <b class="task-count">0</b>
                        </div>

                        <button class="column-add-button" type="button" data-add-category="complete"
                            aria-label="Add a task to complete" title="Add task">
                            ＋
                        </button>
                    </header>

                    <div class="task-list" id="completeTasks" data-task-list="complete"><button type="button" class="board-task"
                            data-task-id="1" fdprocessedid="u6plsr">
                            <span class="board-task-icon">
                                ◇
                            </span>

                            <span class="board-task-content">
                                <strong>Client requirements received</strong>

                                <small>
                                    Record the initial requirements received from the client.
                                </small>
                            </span>

                            <span class="board-task-arrow">
                                ›
                            </span>
                        </button></div>
                </article>

            </section>
        </main>
    </div>
</body>

</html>
