<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link href="../css/main.css" rel="stylesheet" />

    <style>


    </style>


</head>

<body>

    <div class=" main-container">


        <div class="card content-container gap-16">

            <div class="head-container">
                <h1 class="primary">Profile</h1>
            </div>

            <div class="input-group">
                <label for="inputId">Id</label>
                <input id="inputId" type="text" readonly>
            </div>

            <div class="input-group">
                <label for="inputName">Name</label>
                <input id="inputName" type="text" value="meaw" readonly>
            </div>

            <div class="input-group">
                <label for="inputEmail">Email</label>
                <input id="inputEmail" type="email" readonly>
            </div>

            <div class="input-group">
                <label for="inputCreatedDate">Account Created on</label>
                <input id="inputCreatedDate" type="text" readonly>
            </div>

            <div class="input-group">
                <button id="btnLogout"> Logout </button>
            </div>


        </div>

    </div>


    <script src="../js/login.js" type="module"></script>
    
</body>

</html>
