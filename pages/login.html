<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login In — Softly.</title>

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- The same stylesheet used by the dashboard -->
    <link rel="stylesheet" href="../css/main.css">
</head>

<body class="simple-form-page">
    <!-- Theme switcher -->
    <button class="icon-button form-theme-button" id="themeToggle" type="button" aria-label="Switch to dark theme">
        ☾
    </button>

    <main class="simple-form-container">
        <section class="simple-form-card">

            <!-- Logo -->
            <a class="logo" href="#" aria-label="Softly home">
                <span class="brand-mark">
                    <i></i>
                    <i></i>
                </span>

                <strong>Softly.</strong>
            </a>

            <!-- Heading -->
            <header class="simple-form-header">
                <h1>Welcome back</h1>

                <p>Enter your details to access your dashboard.</p>
            </header>

            <!-- Login form -->
            <form class="simple-login-form" id="loginForm">
                <!-- Email field -->
                <div class="simple-field">
                    <label for="loginEmail">Email address</label>

                    <div class="simple-form-input">
                        <span class="field-icon">@</span>
                        <input type="email" id="loginEmail" name="loginEmail" placeholder="Enter your email"
                            autocomplete="email" required>
                    </div>
                </div>

                <!-- Password field -->
                <div class="simple-field">
                    <label for="loginPassword">Password</label>

                    <div class="simple-form-input">
                        <span class="field-icon">◇</span>
                        <input id="loginPassword" name="loginPassword" type="password" placeholder="Enter your password"
                            autocomplete="current-password" minlength="6" required>

                        <button class="show-password-button" id="showPasswordButton" type="button"
                            aria-label="Show password">
                            ◉
                        </button>
                    </div>
                </div>

                <!-- Options -->
                <div class="simple-form-options">

                    <label class="remember-option">
                        <input type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>

                    <a href="#">Forgot password?</a>
                </div>

                <!-- Form button -->
                <button class="btn simple-form-submit" type="submit">
                    Sign in
                </button>
            </form>

            <!-- Registration -->
            <p class="simple-create-account">
                Don’t have an account?
                <a href="register.html">Create account</a>
            </p>

        </section>
    </main>

    <script src="../js/script.js"></script>
    <script src="../js/login.js"></script>
</body>

</html>
